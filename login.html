<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMME | Login</title>
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body class="auth-body">

    <div class="auth-container">
        <header class="app-header">
    <!-- Top U-Star Emblem -->
    <div class="logo-emblem-container">
        <img src="../static/images/logo_emblem.png" alt="LUMME Emblem" class="logo-emblem">
    </div>
    
    <!-- Clean, Rendered Text -->
    <h1 class="brand-title">LUMME</h1>
    <p class="brand-subtitle">NIGHT SAFETY APP</p>
    <div class="brand-divider"></div>
    <span class="brand-tagline">PROTECTED • CONNECTED • ALWAYS</span>
</header>

        <div class="card auth-card">
            <h2>Welcome Back</h2>
            <p class="auth-subtitle">Sign in to stay protected</p>

            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Email or Phone</label>
                    <input type="text" id="login-email" placeholder="Enter your email or phone" required>
                </div>

                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn-primary btn-full">Sign In</button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
            </div>
        </div>
    </div>

</body>
</html>
